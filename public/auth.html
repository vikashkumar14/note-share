<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login / Register - College NoteShare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header" style="background: linear-gradient(90deg, #ff9800 0%, #f44336 100%); box-shadow: 0 4px 24px rgba(47,48,46,0.13);">
        <div class="container">
            <a href="index.html" class="logo" style="color:#0452fc; font-weight:800; font-size:2rem; letter-spacing:-1px;">College NoteShare</a>
            <nav class="main-nav">
                <a href="index.html" class="btn-nav">Home</a>
                <a href="Notes.html" class="btn-nav">Notes</a>
                <a href="upload.html" class="btn-nav">Upload Note</a>
                <a href="auth.html" class="btn-nav active">Login</a>
                <a href="about.html" class="btn-nav">About</a>
                <a href="contact.html" class="btn-nav">Contact</a>
                <a href="profile.html" class="btn-nav">Profile</a>
            </nav>
        </div>
    </header>

    <main class="page-wrapper">
        <div class="centered-card card" style="max-width: 450px;">
            <div class="auth-tabs">
                <button class="auth-tab-btn active" data-form="login-form">Login</button>
                <button class="auth-tab-btn" data-form="register-form">Register</button>
            </div>
            
            <!-- Login Form -->
            <form id="login-form">
                <h2>Welcome Back!</h2>
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
            
            <!-- Register Form (Initially Hidden) -->
            <form id="register-form" style="display: none;">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label for="register-name">Name</label>
                    <input type="text" id="register-name" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="register-semester">Semester</label>
                    <select id="register-semester" required>
                        <option value="">Select Semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="register-branch">Branch</label>
                    <select id="register-branch" required>
                        <option value="">Select Branch</option>
                        <option value="CSE">Computer Science</option>
                        <option value="ECE">Electronics</option>
                        <option value="ME">Mechanical</option>
                        <option value="CE">Civil</option>
                        <option value="EE">Electrical</option>
                        <option value="IT">Information Technology</option>
                       
                        <option value="BCA">Bachelor of Computer Application/option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="register-college">College</label>
                    <input type="text" id="register-college" required>
                </div>
                <div class="form-group">
                    <label for="register-passing">Passing Year</label>
                    <input type="number" id="register-passing" min="2000" max="2100" required>
                </div>
                <button type="submit" class="btn-submit">Register</button>
            </form>
        </div>
    </main>
    <script src="script.js"></script> <!-- कॉमन स्क्रिप्ट -->
    <script>
        // Tab switching logic
        const tabs = document.querySelectorAll('.auth-tab-btn');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                if (tab.dataset.form === 'login-form') {
                    loginForm.style.display = 'block';
                    registerForm.style.display = 'none';
                } else {
                    loginForm.style.display = 'none';
                    registerForm.style.display = 'block';
                }
            });
        });
        
        // Login Logic
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const res = await fetch("https://noteshare-y2kp.onrender.com/api/auth/login", {

                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('authUser', JSON.stringify(data.user));
                localStorage.setItem('userId', data.user._id); // <-- Set userId for Save Note
                alert('Login successful!');
                if (data.user.role === 'admin' || data.user.role === 'faculty') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                alert('Error: ' + data.message);
            }
        });
        
        // Register Logic
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const semester = document.getElementById('register-semester').value;
            const branch = document.getElementById('register-branch').value;
            const college = document.getElementById('register-college').value;
            const passingYear = document.getElementById('register-passing').value;
            const res = await fetch("https://note-share-yfyr.onrender.com/api/auth/register", {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, email, password, semester, college, passingYear, branch })
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message + ' Please login now.');
                // Switch to login tab after successful registration
                document.querySelector('[data-form="login-form"]').click();
            } else {
                alert('Error: ' + data.message);
            }
        });

        // Show info message for all roles
        const infoMsg = document.createElement('div');
        infoMsg.style = 'margin-bottom:1rem;color:#1976d2;font-size:1.05rem;text-align:center;';
        infoMsg.innerHTML = 'Login with your <b>Admin</b>, <b>Faculty</b>, or <b>User</b> account. All roles use the same login form.';
        document.querySelector('.centered-card').insertBefore(infoMsg, document.getElementById('login-form'));
    </script>
</body>
</html>
