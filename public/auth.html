<script>
    // Tab switching logic
    const tabs = document.querySelectorAll('.auth-tab-btn');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            loginForm.style.display = tab.dataset.form === 'login-form' ? 'block' : 'none';
            registerForm.style.display = tab.dataset.form === 'register-form' ? 'block' : 'none';
        });
    });
    
    // Function to get API URL automatically
    function getApiUrl() {
        const hostname = window.location.hostname;
        
        // Agar localhost hai, toh backend port 5000 use karo
        if (hostname === 'localhost' || hostname === '127.0.0.1') {
            return 'http://localhost:5000';
        }
        
        // Agar Vercel par hai, toh empty string return karo 
        // (Isse request automatic '/api/auth/...' par jayegi same domain pe)
        return ''; 
    }

    // 🔵 LOGIN Logic
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        
        // Yahan se URL automatic decide hoga
        const API_URL = getApiUrl();
        
        try {
            console.log(`Sending request to: ${API_URL}/api/auth/login`); // Debugging ke liye

            const res = await fetch(`${API_URL}/api/auth/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password })
            });
            
            const data = await res.json();
            console.log('Login Response:', data);
            
            if (res.ok) {
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('authUser', JSON.stringify(data.user));
                localStorage.setItem('userId', data.user._id);
                alert('Login successful!');
                
                if (data.user.role === 'admin' || data.user.role === 'faculty') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                alert('Error: ' + (data.message || 'Login failed'));
            }
        } catch (err) {
            console.error('Login error:', err);
            alert('Connection error: ' + err.message);
        }
    });
    
    // 🟢 REGISTER Logic
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('register-name').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        const semester = document.getElementById('register-semester').value;
        const branch = document.getElementById('register-branch').value;
        const college = document.getElementById('register-college').value;
        const passingYear = document.getElementById('register-passing').value;
        
        // Yahan bhi URL automatic decide hoga
        const API_URL = getApiUrl();
        
        try {
            const res = await fetch(`${API_URL}/api/auth/register`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, email, password, semester, college, passingYear, branch })
            });
            
            const data = await res.json();
            console.log('Register Response:', data);
            
            if (res.ok) {
                alert('Account created! Please login with your credentials.');
                tabs[0].click(); // Switch to login tab
                document.getElementById('login-email').value = email;
            } else {
                alert('Error: ' + (data.message || 'Registration failed'));
            }
        } catch (err) {
            console.error('Register error:', err);
            alert('Connection error: ' + err.message);
        }
    });
</script>
